  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

r(--accent-dim) 0%, transparent 60%);\n  pointer-events: none;\n  transform: translate(-50%, -50%);\n  z-index: 1;\n  mix-blend-mode: screen;\n  opacity: 0;\n  transition: opacity .8s ease;\n}\n[data-theme=\"light\"] .spot { mix-blend-mode: multiply; }\nbody.ready .spot { opacity: 1; }\n\n.cursor {\n  position: fixed;\n  top: 0; left: 0;\n  width: 10px; height: 10px;\n  background: var(--accent);\n  border-radius: 50%;\n  pointer-events: none;\n  transform: translate(-50%, -50%);\n  z-index: 9999;\n  mix-blend-mode: difference;\n  transition: width .2s ease, height .2s ease, background .2s;\n}\n.cursor.big { width: 40px; height: 40px; background: var(--accent); }\n@media (max-width: 720px) { .cursor, .spot { display: none; } }\n\n/* --- global grid background --- */\n.grid-bg {\n  position: fixed;\n  inset: 0;\n  background-image:\n    linear-gradient(var(--grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--grid) 1px, transparent 1px);\n  background-size: 80px 80px;\n  pointer-events: none;\n  z-index: 0;\n  mask-image: radial-gradient(ellipse at 50% 30%, black 20%, transparent 75%);\n  opacity: .7;\n}\n\n/* --- top bar --- */\n.nav {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  z-index: 100;\n  padding: 18px 32px;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  backdrop-filter: blur(18px);\n  background: color-mix(in oklab, var(--bg) 70%, transparent);\n  border-bottom: 1px solid transparent;\n  transition: border-color .3s, background .3s;\n}\n.nav.scrolled { border-bottom-color: var(--border); }\n.brand {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  font-weight: 600;\n  letter-spacing: -0.02em;\n  font-size: 13px;\n}\n.brand-mark {\n  width: 22px; height: 22px;\n  display: grid;\n  place-items: center;\n  background: var(--fg);\n  color: var(--bg);\n  font-weight: 700;\n  font-size: 11px;\n  border-radius: 3px;\n  font-family: 'JetBrains Mono', monospace;\n}\n.nav-links {\n  display: flex;\n  gap: ack-name\">WordPress<\u002Fdiv>\n      <div class=\"stack-role\">Headless · ACF · REST<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- CTA -->\n<section id=\"contact\">\n  <header class=\"section-head\">\n    <div class=\"section-tag\">\n      <span class=\"num\">06 — contact<\u002Fspan>\n      <span class=\"line\">────────<\u002Fspan>\n      <span>tell me what<br>you're building.<\u002Fspan>\n    <\u002Fdiv>\n    <h2 class=\"section-title reveal\">Got a <em>brief<\u002Fem>?<\u002Fh2>\n  <\u002Fheader>\n  <div class=\"cta\">\n    <div class=\"cta-line reveal\">\n      Send a <em>three-line<\u002Fem> email.<br>\n      I'll reply with honest feedback<br>\n      before a proposal.\n    <\u002Fdiv>\n    <div class=\"cta-foot reveal d1\">\n      <a href=\"mailto:hello@rzlabs.me\" class=\"cta-email decrypt\" data-text=\"hello@rzlabs.me\">hello@rzlabs.me<\u002Fa>\n      <div class=\"cta-cta-side\">\n        // response · &lt; 12h on weekdays<br>\n        <b>booking now · Q2 2026<\u002Fb>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <div class=\"foot-brand\">\n    <h6>rzlabs.me<\u002Fh6>\n    <p>Independent studio run by Fábio Fernandes. Custom web products, commerce, CMS and AI systems — built to last longer than the trend cycle.<\u002Fp>\n  <\u002Fdiv>\n  <div>\n    <h6>Index<\u002Fh6>\n    <a href=\"#services\">services<\u002Fa>\n    <a href=\"#about\">about<\u002Fa>\n    <a href=\"#process\">process<\u002Fa>\n    <a href=\"#work\">work<\u002Fa>\n  <\u002Fdiv>\n  <div>\n    <h6>Contact<\u002Fh6>\n    <a href=\"mailto:hello@rzlabs.me\">hello@rzlabs.me<\u002Fa>\n    <a href=\"#\">github / rzlabs<\u002Fa>\n    <a href=\"#\">x / rzlabs_me<\u002Fa>\n    <a href=\"#\">read.cv / fabiof<\u002Fa>\n  <\u002Fdiv>\n  <div>\n    <h6>Location<\u002Fh6>\n    <a>Porto, Portugal<\u002Fa>\n    <a>UTC+0 · GMT<\u002Fa>\n    <a>available · q2 2026<\u002Fa>\n  <\u002Fdiv>\n  <div class=\"foot-credit\">\n    <span>© 2026 rzlabs — all rights reserved<\u002Fspan>\n    <span id=\"clock\">loading time…<\u002Fspan>\n    <span>made by the same hand that writes the proposals<\u002Fspan>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fmain>\n\n<!-- Tweaks panel (shown via toolbar toggle) -->\n<div id=\"tweaks-panel\">\n  <h5><span>/ tweaks<\u002Fspan><span style=\"color:var(--accent)\">●<\u002Fspan><\u002Fh5>\n  <div class=\"t-row\">\n    <span>theme<\u002Fspan>\n    <div class=\"t-ctrl\" data-group=\"theme\">\n      <button data-val=\"light\">light<\u002Fbutton>\n      <button data-val=\"dark\" class=\"active\">dark<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"t-row\">\n    <span>accent<\u002Fspan>\n    <div class=\"swatches\" data-group=\"accent\">\n      <i data-val=\"amber\" class=\"active\" style=\"background:oklch(0.78 0.16 58)\"><\u002Fi>\n      <i data-val=\"lime\" style=\"background:oklch(0.82 0.16 130)\"><\u002Fi>\n      <i data-val=\"sky\" style=\"background:oklch(0.78 0.15 220)\"><\u002Fi>\n      <i data-val=\"rose\" style=\"background:oklch(0.72 0.16 20)\"><\u002Fi>\n      <i data-val=\"violet\" style=\"background:oklch(0.7 0.17 300)\"><\u002Fi>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"t-row\">\n    <span>personality<\u002Fspan>\n    <div class=\"t-ctrl\" data-group=\"pers\">\n      <button data-val=\"0\" class=\"active\">now<\u002Fbutton>\n      <button data-val=\"1\">stats<\u002Fbutton>\n      <button data-val=\"2\">mark<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"t-row\">\n    <span>density<\u002Fspan>\n    <div class=\"t-ctrl\" data-group=\"density\">\n      <button data-val=\"compact\">compact<\u002Fbutton>\n      <button data-val=\"spacious\" class=\"active\">spacious<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\n  \"theme\": \"dark\",\n  \"accent\": \"lime\",\n  \"personality\": \"1\",\n  \"density\": \"spacious\"\n}/*EDITMODE-END*/;\n\nconst ACCENTS = {\n  amber:  { a:'oklch(0.78 0.16 58)',  dim:'oklch(0.78 0.16 58 / 0.18)',  inkD:'#0a0a0a', lA:'oklch(0.58 0.16 48)', lDim:'oklch(0.58 0.16 48 / 0.14)' },\n  lime:   { a:'oklch(0.82 0.16 130)', dim:'oklch(0.82 0.16 130 / 0.2)',  inkD:'#0a0a0a', lA:'oklch(0.52 0.15 140)', lDim:'oklch(0.52 0.15 140 / 0.14)' },\n  sky:    { a:'oklch(0.78 0.15 220)', dim:'oklch(0.78 0.15 220 / 0.2)',  inkD:'#0a0a0a', lA:'oklch(0.55 0.15 230)', lDim:'oklch(0.55 0.15 230 / 0.14)' },\n  rose:   { a:'oklch(0.72 0.18 20)',  dim:'oklch(0.72 0.18 20 / 0.2)',   inkD:'#0a0a0a', lA:'oklch(0.55 0.18 25)',  lDim:'oklch(0.55 0.18 25 / 0.14)' },\n  violet: { a:'oklch(0.72 0.18 300)', dim:'oklch(0.72 0.18 300 / 0.2)',  inkD:'#0a0a0a', lA:'oklch(0.52 0.18 295)', lDim:'oklch(0.52 0.18 295 / 0.14)' },\n};\n\nconst state = { ...TWEAK_DEFAULTS };\n\nfunction applyTheme(t) {\n  document.documentElement.setAttribute('data-theme', t);\n  document.querySelectorAll('[data-theme-btn]').forEach(b =>\n    b.classList.toggle('active', b.getAttribute('data-theme-btn') === t));\n  document.querySelectorAll('#tweaks-panel [data-group=\"theme\"] button').forEach(b =>\n    b.classList.toggle('active', b.dataset.val === t));\n  applyAccent(state.accent); // re-apply accent (depends on theme)\n}\nfunction applyAccent(name) {\n  const acc = ACCENTS[name] || ACCENTS.amber;\n  const isLight = document.documentElement.getAttribute('data-theme') === 'light';\n  document.documentElement.style.setProperty('--accent', isLight ? acc.lA : acc.a);\n  document.documentElement.style.setProperty('--accent-dim', isLight ? acc.lDim : acc.dim);\n  document.documentElement.style.setProperty('--accent-ink', isLight ? 'var(--bg)' : acc.inkD);\n  document.querySelectorAll('#tweaks-panel [data-group=\"accent\"] i').forEach(i =>\n    i.classList.toggle('active', i.dataset.val === name));\n}\nfunction applyPers(idx) {\n  const i = String(idx);\n  document.querySelectorAll('.pers').forEach(el =>\n    el.classList.toggle('active', el.getAttribute('data-pers-idx') === i));\n  document.querySelectorAll('#persTabs button').forEach(b =>\n    b.classList.toggle('active', b.dataset.pers === i));\n  document.querySelectorAll('#tweaks-panel [data-group=\"pers\"] button').forEach(b =>\n    b.classList.toggle('active', b.dataset.val === i));\n}\nfunction applyDensity(d) {\n  document.body.style.setProperty('--density', d);\n  if (d === 'compact') {\n    document.querySelectorAll('section').forEach(s => s.style.padding = '72px 0');\n  } else {\n    document.querySelectorAll('section').forEach(s => s.style.padding = '');\n  }\n  document.querySelectorAll('#tweaks-panel [data-group=\"density\"] button').forEach(b =>\n    b.classList.toggle('active', b.dataset.val === d));\n}\n\nfunction setKey(k, v) {\n  state[k] = v;\n  if (k === 'theme') applyTheme(v);\n  if (k === 'accent') applyAccent(v);\n  if (k === 'personality') applyPers(v);\n  if (k === 'density') applyDensity(v);\n  window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');\n}\n\n// Initial apply\napplyTheme(state.theme);\napplyAccent(state.accent);\napplyPers(state.personality);\napplyDensity(state.density);\n\n// Theme toggle in nav\ndocument.querySelectorAll('[data-theme-btn]').forEach(b => {\n  b.addEventListener('click', () => setKey('theme', b.getAttribute('data-theme-btn')));\n});\n// Personality tabs in about\ndocument.querySelectorAll('#persTabs button').forEach(b => {\n  b.addEventListener('click', () => setKey('personality', b.dataset.pers));\n});\n// Tweaks panel listeners\ndocument.querySelectorAll('#tweaks-panel [data-group]').forEach(group => {\n  const key = group.dataset.group === 'pers' ? 'personality' : group.dataset.group;\n  group.querySelectorAll('button, i').forEach(el => {\n    el.addEventListener('click', () => setKey(key, el.dataset.val));\n  });\n});\n\n// Edit-mode protocol (tweaks toggle in host toolbar)\nwindow.addEventListener('message', (e) => {\n  const d = e.data || {};\n  if (d.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('open');\n  if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('open');\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\n// ---- Cursor + spotlight ----\nconst cursor = document.getElementById('cursor');\nconst spot = document.querySelector('.spot');\nlet mx = window.innerWidth/2, my = window.innerHeight/2;\nlet cx = mx, cy = my, sx = mx, sy = my;\n\nwindow.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; document.body.classList.add('ready'); });\nfunction raf() {\n  cx += (mx - cx) * 0.25; cy += (my - cy) * 0.25;\n  sx += (mx - sx) * 0.06; sy += (my - sy) * 0.06;\n  cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;\n  spot.style.transform = `translate(${sx}px, ${sy}px) translate(-50%, -50%)`;\n  requestAnimationFrame(raf);\n}\nraf();\n\n// Magnetic buttons + links\ndocument.querySelectorAll('[data-magnet]').forEach(el => {\n  el.addEventListener('mouseenter', () => cursor.classList.add('big'));\n  el.addEventListener('mouseleave', () => { cursor.classList.remove('big'); el.style.transform=''; });\n  el.addEventListener('mousemove', (e) => {\n    const r = el.getBoundingClientRect();\n    const dx = e.clientX - (r.left + r.width/2);\n    const dy = e.clientY - (r.top + r.height/2);\n    el.style.transform = `translate(${dx*0.18}px, ${dy*0.22}px)`;\n  });\n});\n\n// ---- Scroll reveals ----\nconst io = new IntersectionObserver((entries) => {\n  entries.forEach(e => {\n    if (e.isIntersecting) {\n      e.target.classList.add('in');\n      io.unobserve(e.target);\n    }\n  });\n}, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });\ndocument.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n// ---- Nav scroll state ----\nconst nav = document.getElementById('nav');\nwindow.addEventListener('scroll', () => {\n  nav.classList.toggle('scrolled', window.scrollY > 20);\n});\n\n// ---- Typed hero word ----\n(() => {\n  const el = document.querySelector('.typed');\n  if (!el) return;\n  const words = el.dataset.words.split(',');\n  let idx = 0, charIdx = words[0].length, forward = false;\n  function tick() {\n    const cur = words[idx];\n    if (!forward) {\n      charIdx--;\n      el.textContent = cur.slice(0, charIdx);\n      if (charIdx <= 0) { forward = true; idx = (idx + 1) % words.length; }\n      setTimeout(tick, 60 + Math.random()*30);\n    } else {\n      charIdx++;\n      el.textContent = words[idx].slice(0, charIdx);\n      if (charIdx >= words[idx].length) {\n        forward = false;\n        setTimeout(tick, 2200);\n        return;\n      }\n      setTimeout(tick, 80 + Math.random()*40);\n    }\n  }\n  setTimeout(tick, 1400);\n})();\n\n// ---- Clock ----\n(() => {\n  const el = document.getElementById('clock');\n  function tick() {\n    const d = new Date();\n    const hh = String(d.getUTCHours()).padStart(2,'0');\n    const mm = String(d.getUTCMinutes()).padStart(2,'0');\n    const ss = String(d.getUTCSeconds()).padStart(2,'0');\n    el.textContent = `PORTO · ${hh}:${mm}:${ss} UTC`;\n  }\n  tick(); setInterval(tick, 1000);\n})();\n\n// ---- Decrypt hover on email ----\nconst DECRYPT_CHARS = '@#$%&*01/\\\\|<>{}[]~+';\ndocument.querySelectorAll('.decrypt').forEach(el => {\n  const orig = el.dataset.text || el.textContent;\n  let frame = 0, raf2;\n  el.addEventListener('mouseenter', () => {\n    frame = 0;\n    cancelAnimationFrame(raf2);\n    const total = 16;\n    function step() {\n      let out = '';\n      for (let i = 0; i < orig.length; i++) {\n        if (i < frame) out += orig[i];\n        else if (orig[i] === ' ') out += ' ';\n        else out += DECRYPT_CHARS[(Math.random()*DECRYPT_CHARS.length)|0];\n      }\n      el.textContent = out;\n      frame += orig.length / total;\n      if (frame < orig.length) raf2 = requestAnimationFrame(step);\n      else el.textContent = orig;\n    }\n    step();\n  });\n});\n\n// ---- Smooth anchor scroll ----\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n  a.addEventListener('click', (e) => {\n    const id = a.getAttribute('href').slice(1);\n    const t = document.getElementById(id);\n    if (!t) return;\n    e.preventDefault();\n    window.scrollTo({ top: t.offsetTop - 60, behavior: 'smooth' });\n  });\n});\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
